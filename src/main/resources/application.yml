spring:
  application:
    name: realvista
    frontend:
      url: ${FRONTEND_URL:http://localhost:3000}

  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: false

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:realvista_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Jackson Configuration
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

  # Cache Configuration
  cache:
    type: simple
    cache-names:
      - users
      - listings
      - similarListings
      - hiredAgents
      - engagement
      - recommendations

  # Multipart File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:110MB}
      file-size-threshold: ${FILE_SIZE_THRESHOLD:2MB}

  # Server Configuration
  server:
    port: ${SERVER_PORT:8080}
    error:
      include-message: always
      include-binding-errors: always

  # Security Configuration
  security:
    jwt:
      secret-key: ${JWT_SECRET:your_jwt_secret_key}
      expiration: ${JWT_EXPIRATION_MS:86400000}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret}
            redirect-uri: '{baseUrl}/login/oauth2/code/google'
            scope: profile,email
        provider:
          google:
            issuer-uri: https://accounts.google.com
      mobile:
        google:
          android:
            client-id: ${GOOGLE_ANDROID_CLIENT_ID:your_google_android_client_id}
          ios:
            client-id: ${GOOGLE_IOS_CLIENT_ID:your_google_ios_client_id}


# ── AI Microservice Configuration ──
realvista:
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:3001}
    api-key: ${AI_SERVICE_API_KEY:your-secure-internal-api-key}
  recommendation:
    threshold: ${RECOMMENDATION_THRESHOLD:5}
    default-limit: ${RECOMMENDATION_DEFAULT_LIMIT:10}
  listing:
    # Maximum number of days a listing may remain PUBLISHED (business rule: 14 days)
    max-lifetime-days: ${LISTING_MAX_LIFETIME_DAYS:14}
    # Cron expression for the expiry job – runs at the top of every hour by default
    expiry-cron: ${LISTING_EXPIRY_CRON:0 0 * * * *}
    expiry-warning-days: ${LISTING_EXPIRY_WARNING_DAYS:3}
    expiry-warning-cron: ${LISTING_EXPIRY_WARNING_CRON:0 0 8 * * *}

  marble:
    api-url: ${MARBLE_API_URL:https://api.worldlabs.ai/marble/v1}
    api-key: ${MARBLE_API_KEY:}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,git
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  health:
    defaults:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.sep.realvista: DEBUG
    org.springframework.security: DEBUG
    # org.hibernate.SQL: DEBUG
    # org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %X{traceId} - %5p [%t] %c{1}:%L - %m%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} - %X{traceId} - %5p [%t] %c{1}:%L - %m%n'
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v1/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# DigitalOcean Spaces Configuration
digitalocean:
  spaces:
    access-key: ${DIGITALOCEAN_SPACES_ACCESS_KEY:your_access_key}
    secret-key: ${DIGITALOCEAN_SPACES_SECRET_KEY:your_secret_key}
    region: ${DIGITALOCEAN_SPACES_REGION:sgp1}
    endpoint: ${DIGITALOCEAN_SPACES_ENDPOINT:https://sgp1.digitaloceanspaces.com}
    bucket-name: ${DIGITALOCEAN_SPACES_BUCKET_NAME:realvista}
    cdn-endpoint: ${DIGITALOCEAN_SPACES_CDN_ENDPOINT:}

# ── DocuSign eSignature Configuration ──
docusign:
  integration-key: ${DOCUSIGN_INTEGRATION_KEY:}
  user-id: ${DOCUSIGN_USER_ID:}
  account-id: ${DOCUSIGN_ACCOUNT_ID:}
  rsa-private-key: ${DOCUSIGN_RSA_PRIVATE_KEY:}
  base-url: ${DOCUSIGN_BASE_URL:https://demo.docusign.net/restapi}
  auth-server: ${DOCUSIGN_AUTH_SERVER:account-d.docusign.com}
  return-url: ${DOCUSIGN_RETURN_URL:http://localhost:3000}
  webhook-hmac-key: ${DOCUSIGN_WEBHOOK_HMAC_KEY:}
  lease-template-id: ${DOCUSIGN_LEASE_TEMPLATE_ID:}

# ── Payment Gateway Configuration ──
# PayOS: api-url MUST be the API host only — PayOsService appends "/v2/payment-requests".
# Register webhook URL on PayOS dashboard: https://<public-host>/api/v1/billing/webhook/payos
# (PayOS cannot reach http://localhost — use ngrok/cloudflare tunnel for local dev.)
# Values in .env (PAYOS_CLIENT_ID, etc.) override only when referenced below with ${...}.
payment:
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    api-url: ${PAYOS_API_URL:}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:}
    # Must match Return URL on VNPay merchant (register this exact URL, including query).
    return-url: "${VNPAY_RETURN_URL:}"

# ── RabbitMQ STOMP Relay Configuration ──
# Used by WebSocketConfig.configureMessageBroker (STOMP broker relay).
rabbitmq:
  stomp:
    host: ${RABBITMQ_STOMP_HOST:localhost}
    port: ${RABBITMQ_STOMP_PORT:61613}
    login: ${RABBITMQ_STOMP_LOGIN:guest}
    passcode: ${RABBITMQ_STOMP_PASSCODE:guest}

# Email provider selection: smtp (default) or sendgrid
email:
  provider: ${EMAIL_PROVIDER:smtp}

# SendGrid configuration (required when email.provider=sendgrid)
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
