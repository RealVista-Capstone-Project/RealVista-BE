<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xác minh email - RealVista</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="520" cellpadding="0" cellspacing="0"
               style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(112,101,240,.12);">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#7065f0 0%,#5b50d4 100%);padding:36px 40px 28px;text-align:center;">
              <h1 style="margin:0;font-size:26px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;">RealVista</h1>
              <p style="margin:8px 0 0;font-size:14px;color:rgba(255,255,255,0.85);">Xác minh địa chỉ email của bạn</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 40px 32px;">
              <p style="margin:0 0 16px;font-size:15px;color:#374151;">Xin chào <strong th:text="${userName}">Người dùng</strong>,</p>
              <p style="margin:0 0 28px;font-size:15px;color:#6b7280;line-height:1.6;">
                Mã xác minh của bạn là:
              </p>

              <!-- OTP Box -->
              <div style="text-align:center;margin:0 0 28px;">
                <div style="display:inline-block;background:#f5f3ff;border:2px dashed #7065f0;border-radius:12px;padding:20px 48px;">
                  <span style="font-size:40px;font-weight:800;letter-spacing:10px;color:#7065f0;"
                        th:text="${otp}">000000</span>
                </div>
              </div>

              <p style="margin:0 0 8px;font-size:14px;color:#6b7280;text-align:center;">
                Mã có hiệu lực trong <strong th:text="${expiryMinutes}">5</strong> phút.
              </p>
              <p style="margin:0 0 28px;font-size:13px;color:#9ca3af;text-align:center;">
                Nếu bạn không yêu cầu xác minh này, hãy bỏ qua email này.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f9fafb;padding:20px 40px;border-top:1px solid #e5e7eb;text-align:center;">
              <p style="margin:0;font-size:12px;color:#9ca3af;">
                © 2026 RealVista. Mọi quyền được bảo lưu.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
