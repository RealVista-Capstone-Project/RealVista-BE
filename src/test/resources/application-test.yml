# Test Profile Configuration
# Uses H2 in-memory database for fast, isolated testing

spring:
  # Application Configuration
  application:
    frontend:
      url: http://localhost:3000

  # H2 In-Memory Database Configuration
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE ALIAS IF NOT EXISTS jsonb_extract_path_text FOR "com.sep.realvista.integration.H2JsonFunctions.jsonbExtractPathText"
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA/Hibernate Configuration for H2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Enable H2 SQL generation from JPA entities
        hbm2ddl:
          auto: create-drop

  # Flyway Configuration - Disabled for tests
  # Tests use JPA's create-drop to generate schema from entities
  flyway:
    enabled: false

  # Security Configuration for Tests
  security:
    jwt:
      # Base64-encoded test secret key (minimum 256 bits for HS256)
      # This is: "test-secret-key-for-jwt-token-signing-in-unit-tests-only" in base64
      secret-key: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tc2lnbmluZy1pbi11bml0LXRlc3RzLW9ubHkK
      expiration: 86400000 # 24 hours
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            redirect-uri: '{baseUrl}/login/oauth2/code/google'
            scope: profile,email
        provider:
          google:
            issuer-uri: https://accounts.google.com
      mobile:
        google:
          android:
            client-id: test-google-android-client-id
          ios:
            client-id: test-google-ios-client-id

  # Disable Docker Compose for tests
  docker:
    compose:
      enabled: false

  # Logging Configuration for Tests
  logging:
    level:
      root: INFO
      com.sep.realvista: DEBUG
      org.springframework.web: INFO
      org.hibernate: WARN
      org.flywaydb: INFO

# Disable Actuator security for tests
management:
  security:
    enabled: false

# Dummy Spaces configuration for tests to prevent S3Client crash
digitalocean:
  spaces:
    access-key: dummy-access-key
    secret-key: dummy-secret-key
    region: sgp1
    endpoint: https://sgp1.digitaloceanspaces.com
    bucket-name: dummy-bucket
    cdn-endpoint: https://dummy-bucket.sgp1.cdn.digitaloceanspaces.com
