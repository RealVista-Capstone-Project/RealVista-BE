services:
  postgres:
    image: postgres:15-alpine
    container_name: realvista-postgres
    environment:
      POSTGRES_DB: realvista_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - realvista-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: realvista-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@realvista.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - realvista-network
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: realvista-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "61613:61613"  # STOMP
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - realvista-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_stomp &&
             rabbitmq-server"

volumes:
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local

networks:
  realvista-network:
    driver: bridge
