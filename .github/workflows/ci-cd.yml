  # ============================================================================
  # SUMMARY - Always runs to report pipeline status
  # ============================================================================

  # Job 8: CI/CD Summary Report
  ci-cd-summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build, unit-tests, code-coverage, package, containerize]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "CI/CD Pipeline Summary"
          echo "======================"
          echo ""
          echo "--- CI Stage ---"
          echo "Code Quality : ${{ needs.code-quality.result }}"
          echo "Build        : ${{ needs.build.result }}"
          echo "Unit Tests   : ${{ needs.unit-tests.result }}"
          echo "Code Coverage: ${{ needs.code-coverage.result }}"
          echo "Package      : ${{ needs.package.result }}"
          echo ""
          echo "--- CD Stage ---"
          echo "Containerize : ${{ needs.containerize.result }}"
          echo "Deploy       : ${{ needs.deploy.result }}"
          echo ""

          # Fail if any critical CI job failed
          if [[ "${{ needs.code-quality.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.package.result }}" != "success" ]]; then
            echo "CI Pipeline FAILED!"
            exit 1
          fi

          # Check CD stage (only if it was supposed to run)
          if [[ "${{ needs.containerize.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "CD Pipeline FAILED!"
            exit 1
          fi

          echo "Pipeline completed successfully!"

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `
            ## CI/CD Pipeline Results

            ### CI Stage
            | Job | Status |
            |-----|--------|
            | Code Quality | \`${{ needs.code-quality.result }}\` |
            | Build | \`${{ needs.build.result }}\` |
            | Unit Tests | \`${{ needs.unit-tests.result }}\` |
            | Code Coverage | \`${{ needs.code-coverage.result }}\` |
            | Package | \`${{ needs.package.result }}\` |

            ### CD Stage
            | Job | Status |
            |-----|--------|
            | Containerize | \`${{ needs.containerize.result }}\` |
            | Deploy | \`${{ needs.deploy.result }}\` |

            > CD jobs only run on push to \`develop\` or \`main\` branch (skipped for PRs).

            **Overall Status:** \`${{ job.status }}\`

            [View full pipeline run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
              console.log('Comment posted successfully');
            } catch (error) {
              console.error('Failed to post comment:', error.message);
            }
