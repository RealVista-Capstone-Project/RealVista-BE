name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop

# Required permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"

# ============================================================================
# CI STAGE - Runs on all branches and pull requests
# ============================================================================
jobs:
  # Job 1: Code Quality Checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>central-mirror</id>
                <name>Maven Central Mirror</name>
                <url>https://repo1.maven.org/maven2</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Download dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i: Downloading dependencies..."
            if mvn dependency:go-offline -B; then
              echo "Dependencies downloaded successfully"
              break
            else
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
        continue-on-error: true

      - name: Run Checkstyle
        run: mvn checkstyle:check
        continue-on-error: false

      - name: Run SpotBugs
        run: mvn spotbugs:check
        continue-on-error: false

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          retention-days: 7

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7

  # Job 2: Build and Compile
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>central-mirror</id>
                <name>Maven Central Mirror</name>
                <url>https://repo1.maven.org/maven2</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven (skip tests)
        run: mvn clean compile -DskipTests

      - name: Verify build artifacts
        run: |
          if [ ! -d "target/classes" ]; then
            echo "Build failed: target/classes directory not found"
            exit 1
          fi
          echo "Build successful: target/classes exists"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: target/classes
          retention-days: 7

  # Job 3: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>central-mirror</id>
                <name>Maven Central Mirror</name>
                <url>https://repo1.maven.org/maven2</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Unit Tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports
          retention-days: 7

      - name: Check test results
        if: always()
        run: |
          if [ -d "target/surefire-reports" ]; then
            TEST_FAILURES=$(find target/surefire-reports -name "*.xml" -exec grep -l "failures=\"[1-9]" {} \; | wc -l)
            TEST_ERRORS=$(find target/surefire-reports -name "*.xml" -exec grep -l "errors=\"[1-9]" {} \; | wc -l)
            
            if [ "$TEST_FAILURES" -gt 0 ] || [ "$TEST_ERRORS" -gt 0 ]; then
              echo "Tests failed or had errors"
              exit 1
            fi
            echo "All tests passed successfully"
          fi

  # Job 4: Code Coverage
  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>central-mirror</id>
                <name>Maven Central Mirror</name>
                <url>https://repo1.maven.org/maven2</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Download dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i: Downloading dependencies..."
            if mvn dependency:go-offline -B; then
              echo "Dependencies downloaded successfully"
              break
            else
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            fi
          done

      - name: Run tests with coverage
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn clean test jacoco:report

      - name: Check coverage threshold
        run: |
          if [ -f "target/site/jacoco/index.html" ]; then
            echo "Coverage report generated successfully"
            
            # Extract coverage percentage (this is a simple check)
            COVERAGE=$(grep -oP 'Total[^%]*\K[0-9]+(?=%)' target/site/jacoco/index.html | head -1 || echo "0")
            echo "Code coverage: ${COVERAGE}%"
            
            if [ "$COVERAGE" -lt 70 ]; then
              echo "Warning: Coverage is below 70% threshold"
              # Uncomment to fail the build on low coverage
              # exit 1
            fi
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          retention-days: 30

      - name: Upload coverage to Codecov (optional)
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  # Job 5: Package Application
  package:
    name: Package Application
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, code-coverage]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>central-mirror</id>
                <name>Maven Central Mirror</name>
                <url>https://repo1.maven.org/maven2</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Package application
        run: mvn clean package -DskipTests

      - name: Verify JAR file
        run: |
          if [ ! -f "target/realvista-0.0.1-SNAPSHOT.jar" ]; then
            echo "Package failed: JAR file not found"
            exit 1
          fi

          JAR_SIZE=$(du -h target/realvista-0.0.1-SNAPSHOT.jar | cut -f1)
          echo "JAR file created successfully: $JAR_SIZE"

          # Verify JAR is executable
          java -jar target/realvista-0.0.1-SNAPSHOT.jar --version || true

      - name: Extract build info
        run: |
          echo "Build Information:"
          echo "=================="

          if [ -f "target/classes/git.properties" ]; then
            echo "Git Properties:"
            cat target/classes/git.properties
          fi

          if [ -f "target/classes/META-INF/build-info.properties" ]; then
            echo "Build Info:"
            cat target/classes/META-INF/build-info.properties
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 30

      - name: Upload git properties
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: |
            target/classes/git.properties
            target/classes/META-INF/build-info.properties
          retention-days: 30

  # ============================================================================
  # CD STAGE - Only runs on push to 'develop' or 'main' branch (not PRs)
  # ============================================================================

  # Job 6: Build & Push Docker Image
  containerize:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      image_name: ${{ steps.vars.outputs.image }}
      environment: ${{ steps.vars.outputs.environment }}
      profile: ${{ steps.vars.outputs.profile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR number from merge commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query GitHub API to find the PR associated with this merge commit
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "${PR_NUMBER}" ]; then
            echo "number=${PR_NUMBER}" >> $GITHUB_OUTPUT
            echo "tag=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
            echo "Found merged PR #${PR_NUMBER}"
          else
            echo "number=" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
            echo "No associated PR found (direct push)"
          fi

      - name: Set deployment variables
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/realvista"

          if [ "${BRANCH}" == "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "profile=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "profile=dev" >> $GITHUB_OUTPUT
          fi

          # Primary tag: branch-pr-<number> if from a merged PR, otherwise branch-sha
          PR_TAG="${{ steps.pr.outputs.tag }}"
          if [ -n "${PR_TAG}" ]; then
            echo "tag=${BRANCH}-${PR_TAG}" >> $GITHUB_OUTPUT
          else
            echo "tag=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          IMAGE="${{ steps.vars.outputs.image }}"
          PRIMARY_TAG="${{ steps.vars.outputs.tag }}"
          BRANCH="${{ github.ref_name }}"
          SHORT_SHA="${{ steps.vars.outputs.short_sha }}"
          PR_TAG="${{ steps.pr.outputs.tag }}"

          # Always include: primary tag + branch-latest
          TAGS="${IMAGE}:${PRIMARY_TAG}"
          TAGS="${TAGS},${IMAGE}:${BRANCH}-latest"

          # If from a PR, also add branch-sha as a secondary tag for traceability
          if [ -n "${PR_TAG}" ]; then
            TAGS="${TAGS},${IMAGE}:${BRANCH}-${SHORT_SHA}"
          fi

          # main branch also gets :latest
          if [ "${BRANCH}" == "main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Computed tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          echo "Docker Image Tags Pushed:"
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            echo "  - ${tag}"
          done

